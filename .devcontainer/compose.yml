services:
  web:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        NODE_VERSION: 26.9.0
        NODE_ENV: development
    restart: unless-stopped
    # Allow the Ollama VS Code extension (and any app code using Ollama) to reach
    # an Ollama server running on the HOST. Inside the container `127.0.0.1` is the
    # container itself, so the host is addressed as `host.docker.internal`;
    # `host-gateway` resolves that name to the host on Linux too (Docker Desktop
    # provides it, Linux does not by default). The Ollama server on the host must
    # listen on a non-loopback address — start it with `OLLAMA_HOST=0.0.0.0:11434`.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # mounts the workspace folder from the local source tree into the dev container
    # node_modules is mounted as a named volume to isolate it from the host bind
    # mount; Docker initializes the volume from the image's node_modules on first
    # creation (keeps Windows<->Linux native module mismatch out of the bind mount).
    volumes:
      - ..:/workspace/lambdafolio:cached
      - node_modules:/workspace/lambdafolio/node_modules
    # Overrides default command so things don't shut down after the process ends.
    command: /bin/sh -c "while sleep 1000; do :; done"
    ports:
      # Nuxt dev server (root site → http://127.0.0.1:3000/)
      - 3000:3000
      # allows Vite to perform hot module reloading
      - 24678:24678

networks:
  default:
    name: lambdafolio-dev

volumes:
  node_modules:
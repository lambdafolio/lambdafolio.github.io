# Triage a suggestion: parse (model) then check (deterministic).
#
# See docs/suggestion-intake-plan.md §5.2. The split is the whole design:
#
#   step 0  parse-submission.mjs  → a *proposal* (which entry, which field, what
#                                   value). A model may do this: it is a reading
#                                   task, and every output is re-checked.
#   step 1  triage-checks.mjs     → the *verdict* (queued / needs-info /
#                                   needs-curator / duplicate / declined). Never
#                                   a model: this is the rulebook.
#
# The workflow posts one comment restating what it understood, and only queues
# after the submitter confirms ("yes" / a correction). That confirmation is what
# makes a one-box form safe — a misparse costs one reply, not a wrong row.
#
# Security posture:
#   - the submission is passed to the model as delimited DATA with an explicit
#     header; the response schema has no free-form instruction field
#   - no event payload is interpolated into a `run:` block — everything arrives
#     through `env:` and is quoted
#   - no `pull_request_target`; the only trigger is an issue event
#   - the echo comment is workflow-authored, so the submitter cannot edit it;
#     downstream reads the echo, never the live body
#
# Secrets: the parser needs OLLAMA_API_KEY, which comes from the encrypted
# .env.production via the shared decrypt-env action. That is why this workflow is
# safe to run on a public repo: the key never appears in a fork's context,
# because forks cannot open issues here.

name: Triage suggestion

on:
  issues:
    types: [opened, edited]

permissions: {}

concurrency:
  group: triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    # Only our own issue templates, and only issues nobody has answered yet.
    if: contains(github.event.issue.labels.*.name, 'suggestion')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Decrypt environment
        uses: ./.github/actions/decrypt-env
        with:
          dotenv-private-key: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
          environment: production

      # Guard: a confirmation reply must come from the original author, and a
      # label must not have been applied by a stranger. Anything else is treated
      # as a new submission, not a confirmation.
      - name: Parse submission
        id: parse
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          SENDER: ${{ github.event.sender.username }}
          SENDER_ASSOC: ${{ github.event.sender.author_association }}
        run: |
          set -euo pipefail

          # Only the issue author's own edits re-trigger a parse. A maintainer
          # editing the body (e.g. to redact) must not change the proposal.
          if [ "$EVENT_ACTION" = "edited" ]; then
            if [ "$SENDER" != "$ISSUE_AUTHOR" ]; then
              echo "::notice::edit by $SENDER ignored — only the author's edits re-parse"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          node scripts/parse-submission.mjs --issue "$ISSUE_NUMBER" --json > proposal.json
          echo "skip=false" >> "$GITHUB_OUTPUT"
          cat proposal.json

      # The deterministic half. Reads the proposal, re-resolves the entry against
      # the corpus, re-checks vocabulary membership, and classifies the sources.
      - name: Check proposal
        id: check
        if: steps.parse.outputs.skip != 'true'
        run: |
          set -euo pipefail
          node scripts/triage-report.mjs \
            --proposal proposal.json \
            --out verdict.json
          node -e "
            const v = require('./verdict.json');
            console.log('verdict:', v.verdict);
            console.log(v.comment);
          "

      - name: Echo back and label
        if: steps.parse.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          VERDICT_FILE: verdict.json
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        with:
          script: |
            const fs = require('node:fs')
            const verdict = JSON.parse(fs.readFileSync(process.env.VERDICT_FILE, 'utf8'))
            const issue_number = Number(process.env.ISSUE_NUMBER)

            // The echo is the snapshot: it is workflow-authored, so the submitter
            // cannot rewrite it after approval. Downstream reads this, never the
            // live body.
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: verdict.comment
            })

            // Remove any stale verdict label before applying the new one. Labels
            // applied by anyone else are left alone: triage owns only its own.
            const owned = ['queued', 'needs-info', 'needs-curator', 'duplicate', 'declined', 'leads-only', 'has-primary-source']
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner, repo: context.repo.repo, issue_number
            })
            for (const label of issue.labels.map(l => typeof l === 'string' ? l : l.name)) {
              if (owned.includes(label)) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number, name: label
                }).catch(() => {})
              }
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner, repo: context.repo.repo, issue_number, labels: verdict.labels
            })
